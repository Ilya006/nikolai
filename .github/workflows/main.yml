name: Build and deploy to Pages

# Запускается при каждом пуше в main
on:
  push:
    branches:
      - main
  workflow_dispatch: # позволяет запускать вручную из вкладки Actions

# Нужно для официального деплоя через GitHub Pages API (не пуш в ветку)
permissions:
  contents: read
  pages: write
  id-token: write

# Не даёт двум деплоям выполняться одновременно
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # если используешь yarn/pnpm — поменяй здесь и в команде установки ниже

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # если у команды сборки другое имя (например, npm run build:prod) — поправь здесь

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ВАЖНО: укажи здесь реальную папку с результатом сборки.
      # Vite/Vue/большинство современных сборщиков -> dist
      # Create React App -> build
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
