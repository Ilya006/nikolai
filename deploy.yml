name: Build and deploy to Pages

# Запускается при каждом пуше в main (можно сузить до нужных папок через paths:)
on:
  push:
    branches:
      - main
  workflow_dispatch: # позволяет запускать вручную из вкладки Actions

# Нужно для того, чтобы Action мог пушить в build-ветку
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # если используешь yarn/pnpm — поменяй здесь и в команде установки ниже

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # если у команды сборки другое имя (например, npm run build:prod) — поправь здесь

      # ВАЖНО: укажи здесь реальную папку с результатом сборки.
      # Vite/Vue/большинство современных сборщиков -> dist
      # Create React App -> build
      - name: Deploy build to "build" branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          force_orphan: true # держит историю build-ветки плоской, без старых билдов
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy build from ${{ github.sha }}'
